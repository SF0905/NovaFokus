<script>
const formulario = document.querySelector("form");
const campos = formulario.querySelectorAll("input");

const nombre = campos[0];
const correo = formulario.querySelector('input[type="email"]');
const contrasenas = formulario.querySelectorAll('input[type="password"]');
const contrasena = contrasenas[0];
const confirmar = contrasenas[1];
const terminos = formulario.querySelector('input[type="checkbox"]');
const mensaje = document.getElementById("mensaje");

function mostrarMensaje(texto, color) {
    mensaje.textContent = texto;
    mensaje.style.color = color;
}

async function cifrarContrasena(texto) {
    const datos = new TextEncoder().encode(texto);
    const hash = await crypto.subtle.digest("SHA-256", datos);

    return Array.from(new Uint8Array(hash))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
}

formulario.addEventListener("submit", async function(evento) {
    evento.preventDefault();

    if (contrasena.value !== confirmar.value) {
        mostrarMensaje("Las contraseñas no coinciden.", "#dc2626");
        return;
    }

    if (contrasena.value.length < 8) {
        mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "#dc2626");
        return;
    }

    if (!terminos.checked) {
        mostrarMensaje("Debes aceptar los términos para continuar.", "#dc2626");
        return;
    }

    try {
        const usuarios = JSON.parse(
            localStorage.getItem("novafokus_usuarios") || "[]"
        );

        const email = correo.value.trim().toLowerCase();

        if (usuarios.some(usuario => usuario.email === email)) {
            mostrarMensaje("Este correo ya tiene una cuenta registrada.", "#dc2626");
            return;
        }

        const nuevoUsuario = {
            nombre: nombre.value.trim(),
            email: email,
            passwordHash: await cifrarContrasena(contrasena.value)
        };

        usuarios.push(nuevoUsuario);

        localStorage.setItem(
            "novafokus_usuarios",
            JSON.stringify(usuarios)
        );

        localStorage.setItem(
            "novafokus_sesion",
            JSON.stringify({
                nombre: nuevoUsuario.nombre,
                email: nuevoUsuario.email
            })
        );

        mostrarMensaje("¡Cuenta creada! Entrando a NovaFokus...", "#16a34a");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 800);

    } catch (error) {
        mostrarMensaje("No se pudo crear la cuenta. Inténtalo de nuevo.", "#dc2626");
    }
});
</script>
